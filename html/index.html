<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="../img/taskflow-icon.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img id="taskFlowLogo" src="../img/taskflow-icon-transparent.svg" alt="Logo Task Flow">
            <span class="logo-text">
                <span class="task">Task</span> <span class="flow">Flow</span>
            </span>
        </div>
    </header>

    <main>
        <!-- Estatísticas -->
        <section class="stats">
             <div id="statsContainer">

             </div>
        </section>


        <!-- Formulário de nova tarefa -->
        <section class="new-task-section">
            <div id="newTaskContainer">
                <form id="newTaskForm">
                    <input id="titleInput" type="text" placeholder="Adicionar tarefa" required>
                    <div class="new-task-actions">
                        <select id="categorySelect">
                            <option value="work">💼 Trabalho</option>
                            <option value="personal">👤 Pessoal</option>
                            <option value="studies">📚 Estudos</option>
                        </select>
                        <select id="prioritySelect">
                            <option value="low">🟢 Baixa</option>
                            <option value="medium">🟡 Média</option>
                            <option value="high">🔴 Alta</option>
                        </select>
                        <button class="newTaskButton">Adicionar</button>
                    </div>
                </form>
            </div>
        </section>


        <!-- Controles -->
         <section class="controls">
            <!-- Busca de tarefas -->
            <section class="find-task-section">
                <div id="findTaskContainer">
                    <input id="findInput" type="text" placeholder="Buscar tarefa">
                </div>
            </section>

            <!-- Filtros de exibição -->
            <section class="display-filters-section">
                <select id="priorityFilter">
                    <option value="all">Prioridade</option>
                    <option value="high">🔴 Alta prioridade</option>
                    <option value="medium">🟡 Média prioridade</option>
                    <option value="low">🟢 Baixa prioridade</option>
                </select>
                <select id="statusSelector">
                    <option value="all">📝 Todas</option>
                    <option value="done">✅ Concluída</option>
                    <option value="pending">⏳ Pendente</option>
                </select>
            </section>
        </section>

        <!-- Tarefas -->
        <section class="tasks">
            <div id="tasksContainer">
                <ul id="taskList">
                <!-- Adicionar via JS -->
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <p>Task Flow &copy; Todos os direitos reservados.</p>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
