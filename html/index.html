<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="../img/taskflow-icon.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img id="taskFlowLogo" src="../img/taskflow-icon-transparent.svg" alt="Logo Task Flow">
            <span class="logo-text">
                <span class="task">Task</span> <span class="flow">Flow</span>
            </span>
        </div>
    </header>

    <main>
        <!-- Formulário de nova tarefa -->
        <section class="new-task">
            <form>
                <input id="newTaskInput" type="text" placeholder="Insira uma nova tarefa">
                <button id="addTaskButton">Adicionar</button>
            </form>
        </section>
        <!-- Controles de busca -->
        <section class="controls">
            <label>Nível de prioridade</label>
            <select name="priority" id="prioritySelector">
                <option value="priority_high">🔴 Alta prioridade</option>
                <option value="priority_medium">🟡 Média prioridade</option>
                <option value="priority_low">🟢 Baixa prioridade</option>
            </select>

            <Label>Status</label>
            <select name="status" id="statusSelector">
                <option value="status_done">✅ Concluída</option>
                <option value="status_pending">⏳ Pendente</option>
            </select>
        </section>
        <!-- Estatísticas -->
        <section class="stats">

        </section>
        <!-- Tarefas -->
        <section class="tasks">
            <ul id="taskList">

            </ul>
        </section>
    </main>

    <footer>
        <h3>Task Flow &copy; Todos os direitos reservados.</h3>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
