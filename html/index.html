<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="icon" type="image/svg+xml" href="../img/taskflow-icon.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img id="taskFlowLogo" src="../img/taskflow-icon-transparent.svg" alt="Logo Task Flow">
            <span class="logo-text">
                <span class="task">Task</span> <span class="flow">Flow</span>
            </span>
        </div>
    </header>

    <main>
        <!-- Estatísticas -->
        <section class="stats">
             <div class="stats-container">
                <div class="stats-item">
                    <p>Total</p>
                    <span id="totalCount">0</span>
                </div>
                <div class="stats-item">
                    <p>Pendentes</p>
                    <span id="pendingCount">0</span>
                </div>
                <div class="stats-item">
                    <p>Total</p>
                    <span id="doneCount">0</span>
                </div>

                <div class="progress">
                    <div class="progress-container">
                        <div id="progressBar"></div>
                    </div>
                    <span id="progressPercentage">0%</span>
                </div>
             </div>
        </section>


        <!-- Formulário de nova tarefa -->
        <section class="new-task-section">
            <div class="new-task-container">
                <form id="newTaskForm">
                    <input id="titleInput" type="text" placeholder="Adicionar tarefa" required>
                        <select id="prioritySelect">
                            <option value="low">🟢 Baixa prioridade</option>
                            <option value="medium">🟡 Média prioridade</option>
                            <option value="high">🔴 Alta prioridade</option>
                        </select>
                        <button class="new-task-button">Adicionar</button>
                </form>
            </div>
        </section>


        <!-- Controles -->
         <section class="controls">
            <!-- Busca de tarefas -->
            <section class="find-task-section">
                <div class="find-task-container">
                    <input id="findInput" type="text" placeholder="Buscar tarefa">
                </div>
            </section>

            <!-- Filtros de exibição -->
            <section class="display-filters-section">
                <select id="priorityFilter">
                    <option value="all">Prioridade</option>
                    <option value="high">🔴 Alta prioridade</option>
                    <option value="medium">🟡 Média prioridade</option>
                    <option value="low">🟢 Baixa prioridade</option>
                </select>
                <select id="statusSelector">
                    <option value="all">📝 Todas</option>
                    <option value="done">✅ Concluída</option>
                    <option value="pending">⏳ Pendente</option>
                </select>
            </section>
        </section>

        <!-- Tarefas -->
        <section class="tasks">
            <div class="tasks-container">
                <div class="tasks-header">
                    <h3>Tarefas <span id="tasksCount">0</span></h3>
                </div>
                <ul id="taskList">
                <!-- Adicionar via JS -->
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <p>Task Flow &copy; Todos os direitos reservados.</p>
    </footer>

    <!-- Modais -->

    <!-- Deletar -->
    <dialog id="deleteModal">
        <form method="dialog">
            <div class="modal-header">
                <h3>Excluindo tarefa</h3>
            </div>
            <h4>Realmente deseja excluir essa tarefa? Essa ação é irreversível.</h4>
            <div class="modal-actions">
                <button value="cancel" class="cancel-button">Cancelar</button>
                <button id="confirmDelete">Excluir</button>
            </div>
        </form>
    </dialog>

    <!-- Editar -->
     <dialog id="editModal">
        <form method="dialog">
            <div class="modal-header">
                <h3>Editando tarefa</h3>
            </div>
            <input type="text" id="editTitleInput" placeholder="Novo título da tarefa" required>
            <select id="editPriority">
                <option value="low">🟢 Baixa</option>
                <option value="medium">🟡 Média</option>
                <option value="high">🔴 Alta</option>
            </select>
            <div class="modal-actions">
                <button value="cancel" class="cancel-button">Cancelar</button>
                <button id="saveEdit">Salvar tarefa</button>
            </div>
        </form>
     </dialog>


    <script src="../js/script.js"></script>
</body>
</html>
